[package]
name = "desktop-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "desktop-rs"
path = "src/main.rs"

[features]
# Headless PNG rendering of the real UI for visual checks without a display:
#   cargo run --features snapshot -- --snapshot out.png <repo> [changes|history|repos|branches|welcome]
snapshot = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu"]

[dependencies]
gpui_wgpu = { workspace = true, optional = true, features = ["test-support"] }
gd-forge.workspace = true
gd-git.workspace = true
gd-ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_elements.workspace = true
anyhow.workspace = true
notify.workspace = true
dirs.workspace = true
smol.workspace = true
log.workspace = true
env_logger.workspace = true
gd-syntax.workspace = true
serde.workspace = true
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }
notify-debouncer-full = "0.7.0"
ignore = "0.4.33"
lru = "0.19.0"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12.0"
serde_json.workspace = true
git-conventional = "1.1.0"

[dev-dependencies]
tempfile = "3"

# Wayland/X11 backends are only meaningful (and only build) on Linux.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
