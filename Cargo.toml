[workspace]
resolver = "2"
members = ["crates/git", "crates/ui", "crates/syntax", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gd-git = { path = "crates/git" }
gd-ui = { path = "crates/ui" }
gd-syntax = { path = "crates/syntax" }

# GPUI Community Edition, pinned. Bump deliberately (see docs/ARCHITECTURE.md §GPUI-CE).
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a", features = ["font-kit"] }
gpui_wgpu = { package = "gpui_ce_wgpu", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }

anyhow = "1"
similar = { version = "2", features = ["unicode"] }
thiserror = "2"
log = "0.4"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
env_logger = "0.11"
smol = "2"
notify = "8"
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Vendored copy of gpui-ce's text layout crate that breaks long words (vendor/gpui_ce_parley).
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui_ce_parley = { path = "vendor/gpui_ce_parley" }

[profile.dev]
# Keep debug builds snappy to iterate on while still optimizing deps,
# so the UI is representative of real performance during development.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
